<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075 735">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34383C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1075" height="735" fill="#F8F9FA"/>
  <text x="537" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#34383C">Access &amp; Entry Points</text>

  <g transform="translate(0,25)">
  <!-- Clients -->
  <rect x="259" y="15" width="179" height="42" rx="8" fill="#34383C"/>
  <text x="348" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#F8F9FA">Browser (VPN)</text>

  <rect x="606" y="15" width="244" height="42" rx="8" fill="#34383C"/>
  <text x="728" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#F8F9FA">AI Coding Agents</text>
  <text x="728" y="46" text-anchor="middle" font-size="10.5" fill="#D5D8DC">Claude Code / Codex CLI / OpenCode</text>

  <!-- Caddy hub -->
  <rect x="458" y="100" width="160" height="45" rx="8" fill="#8A3F00"/>
  <text x="538" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#F8F9FA">Caddy</text>

  <!-- Client -> Caddy: each line exits its box's true horizontal center, straight down, then enters
       Caddy at the vertical midpoint of its left/right side (y=123) — horizontal approach, not from the top. -->
  <path d="M348,57 L348,113 Q348,123 360,123 L458,123"
        fill="none" stroke="#34383C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="353" y="90" font-size="11" fill="#52565B">browser, HTTPS</text>

  <path d="M728,57 L728,113 Q728,123 716,123 L618,123"
        fill="none" stroke="#34383C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="723" y="90" font-size="11" fill="#52565B" text-anchor="end">API / MCP, HTTPS</text>

  <!-- Tucked right under the spine's own horizontal run (y=167), close to the line without overlapping it -->
  <text x="560" y="181" font-size="11" fill="#52565B">HTTPS, one shared internal CA — fronts every box below</text>

  <!-- Caddy's own trunk goes straight down, direct, to Row 1 (5 boxes) — no detour. A separate line
       breaks off near the top to reach Row 2 (5 boxes) and Row 3 (1 box) via the clear right-hand
       margin (x=1000), each with its own curved peel-off and an 18px straight run into its arrowhead. -->
  <g fill="none" stroke="#34383C" stroke-width="1.6" marker-end="url(#arrow)">
    <!-- Every stretch of line is drawn exactly once (no stacked copies, so curves and thickness stay even):
         the trunk, one bus per row, and short drops into the boxes the bus passes.
         Corner rule: SHARP at a junction, where another line keeps going straight through the turn point;
         CURVED at a plain bend, where nothing continues past the turn point. -->
    <!-- Row 1, straight from Caddy: trunk to Grafana; the bus at y=210 curves down into Outline and
         Sourcebot at its ends; Portainer and Prometheus drop from it. -->
    <path d="M538,145 L538,240"/>
    <path d="M538,210 L190,210 Q178,210 178,222 L178,240"/>
    <path d="M538,210 L886,210 Q898,210 898,222 L898,240"/>
    <path d="M358,210 L358,240"/>
    <path d="M718,210 L718,240"/>
    <!-- Rows 2 and 3, via the right-hand margin: leaves the trunk at y=167, curves down the margin
         (x=1000) and along row 3's bus into Infisical. Row 2's bus leaves the margin at y=345 (sharp:
         the margin continues) and curves into LiteLLM. The other boxes drop from their row's bus. -->
    <path d="M538,167 L988,167 Q1000,167 1000,179 L1000,468 Q1000,480 988,480 L190,480 Q178,480 178,492 L178,510"/>
    <path d="M1000,345 L190,345 Q178,345 178,357 L178,375"/>
    <path d="M358,345 L358,375"/>
    <path d="M538,345 L538,375"/>
    <path d="M718,345 L718,375"/>
    <path d="M898,345 L898,375"/>
    <path d="M358,480 L358,510"/>
    <path d="M538,480 L538,510"/>
  </g>

  <!-- Row 1 (5 boxes): Outline, Portainer, Grafana, Prometheus, Sourcebot -->
  <g font-weight="700" fill="#F8F9FA">
    <rect x="100" y="240" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="178" y="279" text-anchor="middle" font-size="13">Outline</text>
    <text x="178" y="307" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI · <tspan class="mono">:443</tspan></text>

    <rect x="280" y="240" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="358" y="279" text-anchor="middle" font-size="13">Portainer</text>
    <text x="358" y="307" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI · <tspan class="mono">:9443</tspan></text>

    <rect x="460" y="240" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="538" y="279" text-anchor="middle" font-size="13">Grafana</text>
    <text x="538" y="307" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI · <tspan class="mono">:9450</tspan></text>

    <rect x="640" y="240" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="718" y="279" text-anchor="middle" font-size="13">Prometheus</text>
    <text x="718" y="307" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI · <tspan class="mono">:9090</tspan></text>

    <rect x="820" y="240" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="898" y="279" text-anchor="middle" font-size="13">Sourcebot</text>
    <text x="898" y="307" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI + API · <tspan class="mono">:9460</tspan></text>
  </g>

  <!-- Row 2 (5 boxes): LiteLLM, Qdrant, Langfuse, Memgraph Lab, Neo4j (browser) -->
  <g font-weight="700" fill="#F8F9FA">
    <rect x="100" y="375" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="178" y="414" text-anchor="middle" font-size="13">LiteLLM</text>
    <text x="178" y="442" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI + API · <tspan class="mono">:4000</tspan></text>

    <rect x="280" y="375" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="358" y="414" text-anchor="middle" font-size="13">Qdrant</text>
    <text x="358" y="442" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI + API · <tspan class="mono">:6333</tspan></text>

    <rect x="460" y="375" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="538" y="414" text-anchor="middle" font-size="13">Langfuse</text>
    <text x="538" y="442" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI + API · <tspan class="mono">:9470</tspan></text>

    <rect x="640" y="375" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="718" y="414" text-anchor="middle" font-size="13">Memgraph Lab</text>
    <text x="718" y="442" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI · <tspan class="mono">:9490</tspan></text>

    <rect x="820" y="375" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="898" y="414" text-anchor="middle" font-size="13">Neo4j (browser)</text>
    <text x="898" y="442" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Browser UI · <tspan class="mono">:7474</tspan></text>
  </g>


  <!-- "SSO" badges: every app that signs in through Dex. Outline, Portainer, Grafana, Langfuse (and Open WebUI, below) show a
       "Sign in with Dex" button; Prometheus, Qdrant, Memgraph Lab, Neo4j Browser sit behind the sign-in
       gate (Caddy import sso). Top-right of each box, clear of the box name. -->
  <g>
    <rect x="211" y="248" width="36" height="16" rx="8" fill="#F8F9FA"/>
    <text x="229" y="259.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
    <rect x="391" y="248" width="36" height="16" rx="8" fill="#F8F9FA"/>
    <text x="409" y="259.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
    <rect x="571" y="248" width="36" height="16" rx="8" fill="#F8F9FA"/>
    <text x="589" y="259.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
    <rect x="571" y="383" width="36" height="16" rx="8" fill="#F8F9FA"/>
    <text x="589" y="394.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
    <rect x="751" y="248" width="36" height="16" rx="8" fill="#F8F9FA"/>
    <text x="769" y="259.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
    <rect x="391" y="383" width="36" height="16" rx="8" fill="#F8F9FA"/>
    <text x="409" y="394.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
    <rect x="751" y="383" width="36" height="16" rx="8" fill="#F8F9FA"/>
    <text x="769" y="394.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
    <rect x="931" y="383" width="36" height="16" rx="8" fill="#F8F9FA"/>
    <text x="949" y="394.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
  </g>

  <!-- Row 3 (3 boxes, same columns as the rows above) + Direct-ports group, sharing the same line -->
  <g font-weight="700" fill="#F8F9FA">
    <rect x="100" y="510" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="178" y="549" text-anchor="middle" font-size="13">Infisical</text>
    <text x="178" y="577" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Secrets · <tspan class="mono">:8080</tspan></text>

    <rect x="280" y="510" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="358" y="549" text-anchor="middle" font-size="13">Dex</text>
    <text x="358" y="577" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Sign-in · <tspan class="mono">:5556</tspan></text>
    <rect x="460" y="510" width="155" height="90" rx="10" fill="#1450A0"/>
    <text x="538" y="549" text-anchor="middle" font-size="13">Open WebUI</text>
    <text x="538" y="577" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Chat · <tspan class="mono">:9485</tspan></text>
  </g>
  <!-- SSO badge for Open WebUI (Dex button), same place as the badges above -->
  <rect x="571" y="518" width="36" height="16" rx="8" fill="#F8F9FA"/>
  <text x="589" y="529.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>

  <!-- Direct-access group: fourth column to the grid edge (640-975); 20px margin each side, three boxes of 92
       with 10px gaps: OpenHands (plain HTTP for the browser) and the two bolt ports (client apps) -->
  <rect x="640" y="510" width="335" height="110" rx="14" fill="#FBF1E7" stroke="#E3C39A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="660" y="535" font-size="14" font-weight="700" fill="#8A3F00">Direct ports — not via Caddy</text>
  <text x="660" y="551" font-size="10.5" fill="#8A3F00">plain HTTP (OpenHands) and bolt for client apps</text>

  <g font-weight="700" fill="#8A3F00">
    <rect x="660" y="560" width="92" height="46" rx="10" fill="#F8F9FA" stroke="#8A3F00" stroke-width="1.6"/>
    <text x="706" y="579" text-anchor="middle" font-size="13">OpenHands</text>
    <text x="706" y="594" text-anchor="middle" font-size="9.5" font-weight="400">HTTP · <tspan class="mono">:3000</tspan></text>

    <rect x="762" y="560" width="92" height="46" rx="10" fill="#F8F9FA" stroke="#8A3F00" stroke-width="1.6"/>
    <text x="808" y="579" text-anchor="middle" font-size="13">Neo4j</text>
    <text x="808" y="594" text-anchor="middle" font-size="9.5" font-weight="400">bolt · <tspan class="mono">:7687</tspan></text>

    <rect x="864" y="560" width="92" height="46" rx="10" fill="#F8F9FA" stroke="#8A3F00" stroke-width="1.6"/>
    <text x="910" y="579" text-anchor="middle" font-size="13">Memgraph</text>
    <text x="910" y="594" text-anchor="middle" font-size="9.5" font-weight="400">bolt · <tspan class="mono">:7688</tspan></text>
  </g>

  <!-- AI Coding Agents -> Direct-access group: exits the box's own right edge at its vertical
       midpoint (y=36, box spans 15-57) — purely horizontal — then curves down the margin, clear of
       the API/MCP line above, and curves left into the group's right side at its vertical midpoint. -->
  <path d="M850,36 L1028,36 Q1040,36 1040,48 L1040,553 Q1040,565 1028,565 L975,565"
        fill="none" stroke="#8A3F00" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="1030" y="70" text-anchor="end" font-size="11" fill="#8A3F00">driver protocol,</text>
  <text x="1030" y="83" text-anchor="end" font-size="11" fill="#8A3F00">for client apps</text>

  <!-- Legend -->
  <g font-size="11" fill="#34383C">
    <rect x="100" y="650" width="16" height="16" rx="4" fill="#1450A0"/>
    <text x="122" y="662">Fronted by Caddy (HTTPS, shared internal CA)</text>

    <rect x="437" y="650" width="16" height="16" rx="4" fill="#F8F9FA" stroke="#8A3F00" stroke-width="1.6"/>
    <text x="459" y="662">Direct port, bypasses Caddy</text>

    <rect x="687" y="650" width="16" height="16" rx="4" fill="#8A3F00"/>
    <text x="709" y="662">Reverse proxy / entry hub</text>

    <rect x="907" y="650" width="16" height="16" rx="4" fill="#34383C"/>
    <text x="929" y="662">External client</text>

    <rect x="100" y="676" width="36" height="16" rx="8" fill="#F8F9FA" stroke="#1450A0" stroke-width="1"/>
    <text x="118" y="687.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1450A0">SSO</text>
    <text x="142" y="688">Single sign-on through Dex: a "Sign in with Dex" button, or (Prometheus, Qdrant, Memgraph Lab, Neo4j) Dex login first</text>
  </g>
  </g>
</svg>
