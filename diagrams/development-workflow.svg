<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34383C"/>
    </marker>
    <marker id="arrowDash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8F94A0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1075" height="400" fill="#F8F9FA"/>
  <text x="537" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#34383C">Software Development Workflow</text>

  <!-- Start: the idea -->
  <rect x="18" y="85" width="66" height="36" rx="18" fill="#F1F3F5" stroke="#52565B" stroke-width="1.5"/>
  <text x="51" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#34383C">Idea</text>

  <!-- Row 1, left to right: steps 1 to 5. Boxes 160x90 at x 120, 310, 500, 690, 880:
       name at 0.43 h, subtext at 0.745 h. Blue: uses the AI server; outlined: outside it -->
  <g font-size="13" font-weight="700">
    <rect x="120" y="58" width="160" height="90" rx="10" fill="#1450A0"/>
    <text x="200" y="97" text-anchor="middle" fill="#F8F9FA"><tspan class="mono">1</tspan>  Requirements</text>
    <text x="200" y="125" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">PRD, acceptance criteria</text>

    <rect x="310" y="58" width="160" height="90" rx="10" fill="#1450A0"/>
    <text x="390" y="97" text-anchor="middle" fill="#F8F9FA"><tspan class="mono">2</tspan>  Understand</text>
    <text x="390" y="125" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Sourcebot, Open WebUI</text>

    <rect x="500" y="58" width="160" height="90" rx="10" fill="#1450A0"/>
    <text x="580" y="97" text-anchor="middle" fill="#F8F9FA"><tspan class="mono">3</tspan>  Plan</text>
    <text x="580" y="125" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">agent plan from the PRD</text>

    <rect x="690" y="58" width="160" height="90" rx="10" fill="#1450A0"/>
    <text x="770" y="97" text-anchor="middle" fill="#F8F9FA"><tspan class="mono">4</tspan>  Code with an agent</text>
    <text x="770" y="125" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">Claude Code, Codex, OpenHands</text>

    <rect x="880" y="58" width="160" height="90" rx="10" fill="#F1F3F5" stroke="#1450A0" stroke-width="1.5"/>
    <text x="960" y="97" text-anchor="middle" fill="#34383C"><tspan class="mono">5</tspan>  Test locally</text>
    <text x="960" y="125" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52565B">unit, Playwright, Cucumber</text>
  </g>

  <!-- Row 2, right to left: steps 6 to 10, same columns -->
  <g font-size="13" font-weight="700">
    <rect x="880" y="238" width="160" height="90" rx="10" fill="#F1F3F5" stroke="#1450A0" stroke-width="1.5"/>
    <text x="960" y="277" text-anchor="middle" fill="#34383C"><tspan class="mono">6</tspan>  Pull request</text>
    <text x="960" y="305" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52565B">GitHub; no secrets in code</text>

    <rect x="690" y="238" width="160" height="90" rx="10" fill="#1450A0"/>
    <text x="770" y="277" text-anchor="middle" fill="#F8F9FA"><tspan class="mono">7</tspan>  CI on the AI server</text>
    <text x="770" y="305" text-anchor="middle" font-size="9.5" font-weight="400" fill="#CFE0F4">tests, checks, AI review</text>

    <rect x="500" y="238" width="160" height="90" rx="10" fill="#F1F3F5" stroke="#1450A0" stroke-width="1.5"/>
    <text x="580" y="277" text-anchor="middle" fill="#34383C"><tspan class="mono">8</tspan>  Merge</text>
    <text x="580" y="305" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52565B">every check green</text>

    <rect x="310" y="238" width="160" height="90" rx="10" fill="#F1F3F5" stroke="#1450A0" stroke-width="1.5"/>
    <text x="390" y="277" text-anchor="middle" fill="#34383C"><tspan class="mono">9</tspan>  Deploy to Azure</text>
    <text x="390" y="305" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52565B">GitHub-hosted runner</text>

    <rect x="120" y="238" width="160" height="90" rx="10" fill="#F1F3F5" stroke="#1450A0" stroke-width="1.5"/>
    <text x="200" y="277" text-anchor="middle" fill="#34383C"><tspan class="mono">10</tspan>  Watch</text>
    <text x="200" y="305" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52565B">Sentry, Azure DevOps, Langfuse</text>
  </g>

  <!-- Next step: straight runs between boxes, each at least 16px into its arrowhead -->
  <g stroke="#34383C" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="84" y1="103" x2="120" y2="103"/>
    <line x1="280" y1="103" x2="310" y2="103"/>
    <line x1="470" y1="103" x2="500" y2="103"/>
    <line x1="660" y1="103" x2="690" y2="103"/>
    <line x1="850" y1="103" x2="880" y2="103"/>
    <line x1="960" y1="148" x2="960" y2="238"/>
    <line x1="880" y1="283" x2="850" y2="283"/>
    <line x1="690" y1="283" x2="660" y2="283"/>
    <line x1="500" y1="283" x2="470" y2="283"/>
    <line x1="310" y1="283" x2="280" y2="283"/>
  </g>
  <text x="968" y="197" font-size="11" fill="#34383C">push a branch</text>

  <!-- Back to an earlier step: CI to the agent, and watching to new requirements -->
  <g stroke="#8F94A0" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowDash)">
    <line x1="770" y1="238" x2="770" y2="148"/>
    <line x1="200" y1="238" x2="200" y2="148"/>
  </g>
  <text x="778" y="190" font-size="11" fill="#52565B">fix what fails,</text>
  <text x="778" y="204" font-size="11" fill="#52565B">answer the review</text>
  <text x="208" y="190" font-size="11" fill="#52565B">a bug or</text>
  <text x="208" y="204" font-size="11" fill="#52565B">a new need</text>

  <!-- Legend -->
  <g font-size="11" fill="#34383C">
    <rect x="120" y="358" width="16" height="16" rx="4" fill="#1450A0"/>
    <text x="142" y="370">Uses the AI server</text>

    <rect x="280" y="358" width="16" height="16" rx="4" fill="#F1F3F5" stroke="#1450A0" stroke-width="1.5"/>
    <text x="302" y="370">Outside it: your PC, GitHub, Azure, Sentry</text>

    <line x1="560" y1="366" x2="590" y2="366" stroke="#34383C" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="600" y="370">Next step</text>

    <line x1="690" y1="366" x2="720" y2="366" stroke="#8F94A0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDash)"/>
    <text x="730" y="370">Back to an earlier step</text>
  </g>
</svg>
